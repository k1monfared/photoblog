name: Deploy Photoblog

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Restore build cache
        uses: actions/cache@v4
        with:
          path: |
            _site
            .build_cache.json
            .build_tools_hash
          key: photoblog-build-${{ hashFiles('scripts/build.py', 'templates/**', 'static/**') }}-${{ hashFiles('posts/*.md') }}
          restore-keys: |
            photoblog-build-${{ hashFiles('scripts/build.py', 'templates/**', 'static/**') }}-
            photoblog-build-

      - name: Force full rebuild only if build tools/templates changed
        run: |
          TOOLS_HASH="${{ hashFiles('scripts/build.py', 'templates/**', 'static/**') }}"
          if [ -f .build_tools_hash ] && [ "$(cat .build_tools_hash)" = "$TOOLS_HASH" ]; then
            echo "Build tools unchanged, incremental build"
          else
            echo "Build tools changed, forcing full rebuild"
            rm -f .build_cache.json
          fi
          echo "$TOOLS_HASH" > .build_tools_hash

      - name: Build photoblog
        run: python scripts/build.py

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
